[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hmp-gsa"
version = "0.1.0"
description = "HMP-GSA research prototype"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["hmp_gsa*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
